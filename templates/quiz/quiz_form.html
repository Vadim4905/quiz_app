{% extends "base.html" %}
{% load i18n %}
{% load crispy_forms_tags %}



{% block content %}

  <div class="container d-flex justify-content-center align-items-center">
    <form action="" method="post" enctype="multipart/form-data">
      {{ form|crispy }}
      {% csrf_token %}
      
      <button type="submit" class="btn btn-primary">{% translate "Save quiz" %} </button>
    </form>
  </div>

{% endblock %}
